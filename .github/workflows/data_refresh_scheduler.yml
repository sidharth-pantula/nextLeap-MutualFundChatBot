name: Mutual Fund Data Freshness & Knowledge Ingestion Scheduler

on:
  # Daily automated run at 23:00 IST (17:30 UTC) Monday through Friday
  schedule:
    - cron: '30 17 * * 1-5'
  
  # Manual on-demand execution trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      force:
        description: 'Force full re-scrape and vector re-indexing even if no attribute diffs are detected'
        required: false
        type: boolean
        default: false

jobs:
  refresh-and-verify:
    name: Refresh Groww Data & Synchronize ChromaDB
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Ingestion Scheduler Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "[INFO] Running forced ingestion pipeline..."
            python -m src.ingestion.scheduler --run-once --force
          else
            echo "[INFO] Running scheduled ingestion pipeline with diff detection..."
            python -m src.ingestion.scheduler --run-once
          fi

      - name: Run Quality & Compliance Benchmark Evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m tests.eval_runner

      - name: Commit & Push Updated Knowledge Base Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): automated mutual fund factsheet & vector sync [skip ci]"
          file_pattern: "data/raw/* data/processed/* data/chromadb/* data/ingestion_logs.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
